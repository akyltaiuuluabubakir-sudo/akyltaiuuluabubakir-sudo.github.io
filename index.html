<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Эта строчка нужна, чтобы сайт правильно масштабировался на смартфонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>
    <style>
        /* 1. БАЗОВЫЕ СТИЛИ (для обычных экранов, например, планшетов) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        h1 { 
            color: #0071e3; 
            transition: color 0.3s ease;
        }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 980px;
            font-size: 16px;
            cursor: pointer;
            width: auto;
            transition: all 0.3s ease;
        }
        button:hover { 
            background-color: #0077ed; 
        }
        .link-container {
            margin-top: 20px;
        }
        .link-container a {
            color: #0071e3;
            text-decoration: none;
            font-weight: 500;
        }
        .link-container a:hover {
            text-decoration: underline;
        }
        .guestbook {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e5e5e7;
            text-align: left;
        }
        .guestbook h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }
        .guestbook-intro, .guestbook-status {
            color: #6e6e73;
            font-size: 14px;
        }
        .guestbook-form {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }
        .guestbook-form[hidden] {
            display: none;
        }
        .guestbook-form label {
            font-size: 14px;
            font-weight: 600;
        }
        .guestbook-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            font: inherit;
        }
        .guestbook-form button {
            justify-self: start;
            border-radius: 8px;
        }
        .guestbook-status {
            min-height: 20px;
            margin: 10px 0 0;
        }
        .guestbook-list {
            display: grid;
            gap: 10px;
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
        }
        .guestbook-entry {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            background: #f5f5f7;
            border-radius: 8px;
        }
        .guestbook-entry-main {
            min-width: 0;
        }
        .guestbook-entry strong {
            overflow-wrap: anywhere;
        }
        .guestbook-entry span, .guestbook-entry time {
            display: block;
            margin-top: 4px;
            color: #6e6e73;
            font-size: 13px;
        }
        .guestbook-delete {
            flex: 0 0 auto;
            width: auto;
            padding: 6px 10px;
            border: 1px solid #d0d0d4;
            border-radius: 6px;
            background: white;
            color: #b42318;
            font-size: 14px;
        }
        .guestbook-delete:hover {
            background: #fff1f0;
        }

        /* 📱 2. СТИЛИ ДЛЯ ТЕЛЕФОНОВ (ширина экрана от 0 до 480px) */
        @media (max-width: 480px) {
            body {
                background-color: #ffffff; /* Белый фон на смартфонах */
                padding: 20px;
                justify-content: flex-start;
                padding-top: 40px;
            }
            .card {
                box-shadow: none; /* Убираем тень */
                padding: 15px;
                width: 100%;
            }
            h1 {
                font-size: 24px;
                color: #0071e3; /* Здесь можно поменять цвет для мобильных */
            }
            button {
                width: 100%; /* Кнопка во всю ширину экрана */
                padding: 15px;
            }
            .guestbook-delete {
                width: auto;
                padding: 6px 10px;
            }
        }

        /* 💻 3. СТИЛИ ТОЛЬКО ДЛЯ ПК (ширина экрана от 1024px и больше) */
        @media (min-width: 1024px) {
            body {
                background-color: #e3efff; /* Нежно-синий фон на компьютерах */
            }
            .card {
                border: 2px solid #0071e3; /* Добавляем синюю рамку */
                transform: scale(1.05); /* Чуть-чуть увеличиваем карточку */
            }
            h1 {
                color: #ff4500; /* Ярко-оранжевый заголовок только на ПК */
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ваша круглая аватарка (убедитесь, что файл avatar.jpg лежит в той же папки) -->
        <img src="avatar.jpg" alt="Моё фото" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px;">
        
        <h1>Привет, Я Турганбаев Абубакир</h1>
        <p>Я собираю список тех кто посетил мою страницу и хочет оставить след.</p>
        
        <button type="button" id="show-guestbook" aria-expanded="false" aria-controls="guestbook-form">Оставить след</button>
            <section class="guestbook" aria-labelledby="guestbook-title">
            <h2 id="guestbook-title">Гостевая книга</h2>
                <p class="guestbook-intro">Расскажите, как вас зовут и в какой группе вы учитесь.</p>
            <form class="guestbook-form" id="guestbook-form" hidden>
                    <label for="nickname">Никнейм</label>
                    <input id="nickname" name="nickname" maxlength="40" autocomplete="nickname" required>
                    <label for="study-group">Группа <span>(необязательно)</span></label>
                    <input id="study-group" name="study-group" maxlength="40" autocomplete="off">
                    <button type="submit">Оставить запись</button>
                </form>
                <p class="guestbook-status" id="guestbook-status" role="status" aria-live="polite"></p>
                <ul class="guestbook-list" id="guestbook-list" aria-label="Записи посетителей"></ul>
            </section>

        <!-- Ссылка на вторую страницу -->
        <div class="link-container">
            <a href="projects.html">Посмотреть мои проекты →</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://bfrhcvkjnwhwlxyeiqic.supabase.co";
        const supabaseAnonKey = "sb_publishable_72YdsagZ1ysJBikS___SmA_o92yw7i0";
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
        const guestbookForm = document.querySelector("#guestbook-form");
        const guestbookList = document.querySelector("#guestbook-list");
        const guestbookStatus = document.querySelector("#guestbook-status");
        const showGuestbookButton = document.querySelector("#show-guestbook");

        showGuestbookButton.addEventListener("click", () => {
            guestbookForm.hidden = false;
            showGuestbookButton.setAttribute("aria-expanded", "true");
            document.querySelector("#nickname").focus();
        });

        function isSupabaseConfigured() {
            return supabaseUrl.startsWith("https://") && !supabaseUrl.includes("YOUR_") && !supabaseAnonKey.includes("YOUR_");
        }

        async function ensureAnonymousSession() {
            const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
            if (sessionError) throw sessionError;
            if (sessionData.session) return sessionData.session;

            const { data, error } = await supabaseClient.auth.signInAnonymously();
            if (error) throw error;
            return data.session;
        }

        async function loadEntries() {
            if (!isSupabaseConfigured()) {
                guestbookStatus.textContent = "Список появится после подключения Supabase.";
                return;
            }

            try {
                const session = await ensureAnonymousSession();
                const { data: latestEntries, error: latestError } = await supabaseClient
                    .from("guestbook_entries")
                    .select("id,nickname,study_group,created_at,owner_id")
                    .order("created_at", { ascending: false })
                    .limit(50);
                if (latestError) throw latestError;
                const { data: ownEntries, error: ownError } = await supabaseClient
                    .from("guestbook_entries")
                    .select("id,nickname,study_group,created_at,owner_id")
                    .eq("owner_id", session.user.id);
                if (ownError) throw ownError;

                const entries = [...new Map([...latestEntries, ...ownEntries].map((entry) => [entry.id, entry])).values()]
                    .sort((first, second) => new Date(second.created_at) - new Date(first.created_at));

                guestbookList.replaceChildren();
                const ownEntryCount = ownEntries.length;
                guestbookForm.querySelector("button[type='submit']").disabled = ownEntryCount >= 2;

                for (const entry of entries) {
                    const item = document.createElement("li");
                    item.className = "guestbook-entry";
                    const details = document.createElement("div");
                    details.className = "guestbook-entry-main";
                    const nickname = document.createElement("strong");
                    nickname.textContent = entry.nickname;
                    details.append(nickname);

                    if (entry.study_group) {
                        const group = document.createElement("span");
                        group.textContent = `Группа: ${entry.study_group}`;
                        details.append(group);
                    }

                    const date = document.createElement("time");
                    date.dateTime = entry.created_at;
                    date.textContent = new Date(entry.created_at).toLocaleDateString("ru-RU");
                    details.append(date);
                    item.append(details);

                    if (entry.owner_id === session.user.id) {
                        const deleteButton = document.createElement("button");
                        deleteButton.className = "guestbook-delete";
                        deleteButton.type = "button";
                        deleteButton.textContent = "Удалить";
                        deleteButton.setAttribute("aria-label", `Удалить запись ${entry.nickname}`);
                        deleteButton.addEventListener("click", () => deleteEntry(entry.id, deleteButton));
                        item.append(deleteButton);
                    }

                    guestbookList.append(item);
                }
                guestbookStatus.textContent = ownEntryCount >= 2
                    ? "Вы использовали лимит в 2 записи. Удалите свою запись, чтобы освободить место."
                    : entries.length ? "" : "Пока записей нет. Будьте первым!";
            } catch (error) {
                guestbookStatus.textContent = "Не удалось загрузить список. Попробуйте позже.";
                console.error(error);
            }
        }

        async function deleteEntry(entryId, deleteButton) {
            deleteButton.disabled = true;
            guestbookStatus.textContent = "Удаляем запись...";

            try {
                const { error } = await supabaseClient
                    .from("guestbook_entries")
                    .delete()
                    .eq("id", entryId);
                if (error) throw error;
                await loadEntries();
                guestbookStatus.textContent = "Запись удалена.";
            } catch (error) {
                guestbookStatus.textContent = "Не удалось удалить запись. Попробуйте позже.";
                deleteButton.disabled = false;
                console.error(error);
            }
        }

        guestbookForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!isSupabaseConfigured()) {
                guestbookStatus.textContent = "Сначала подключите Supabase, чтобы сохранять записи.";
                return;
            }

            const submitButton = guestbookForm.querySelector("button");
            submitButton.disabled = true;
            guestbookStatus.textContent = "Сохраняем запись...";
            const formData = new FormData(guestbookForm);
            const nickname = formData.get("nickname").trim();
            const studyGroup = formData.get("study-group").trim();

            try {
                const session = await ensureAnonymousSession();
                const { error } = await supabaseClient.from("guestbook_entries").insert({
                    nickname,
                    study_group: studyGroup || null,
                    owner_id: session.user.id
                });
                if (error) throw error;
                guestbookForm.reset();
                await loadEntries();
                guestbookStatus.textContent = "Запись добавлена. Спасибо!";
            } catch (error) {
                guestbookStatus.textContent = error.code === "23514"
                    ? "У вас уже есть 2 записи. Удалите одну, чтобы добавить новую."
                    : "Не удалось сохранить запись. Попробуйте позже.";
                console.error(error);
            } finally {
                submitButton.disabled = false;
            }
        });

        loadEntries();
    </script>
</body>
</html>
