<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Эта строчка нужна, чтобы сайт правильно масштабировался на смартфонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя первая страница</title>
    <style>
        /* 1. БАЗОВЫЕ СТИЛИ (для обычных экранов, например, планшетов) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 85%;
            max-width: 400px;
            transition: all 0.3s ease;
        }
        h1 { 
            color: #0071e3; 
            transition: color 0.3s ease;
        }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 980px;
            font-size: 16px;
            cursor: pointer;
            width: auto;
            transition: all 0.3s ease;
        }
        button:hover { 
            background-color: #0077ed; 
        }
        .link-container {
            margin-top: 20px;
        }
        .link-container a {
            color: #0071e3;
            text-decoration: none;
            font-weight: 500;
        }
        .link-container a:hover {
            text-decoration: underline;
        }

        /* 📱 2. СТИЛИ ДЛЯ ТЕЛЕФОНОВ (ширина экрана от 0 до 480px) */
        @media (max-width: 480px) {
            body {
                background-color: #ffffff; /* Белый фон на смартфонах */
                padding: 20px;
                justify-content: flex-start;
                padding-top: 40px;
            }
            .card {
                box-shadow: none; /* Убираем тень */
                padding: 15px;
                width: 100%;
            }
            h1 {
                font-size: 24px;
                color: #0071e3; /* Здесь можно поменять цвет для мобильных */
            }
            button {
                width: 100%; /* Кнопка во всю ширину экрана */
                padding: 15px;
            }
        }

        /* 💻 3. СТИЛИ ТОЛЬКО ДЛЯ ПК (ширина экрана от 1024px и больше) */
        @media (min-width: 1024px) {
            body {
                background-color: #e3efff; /* Нежно-синий фон на компьютерах */
            }
            .card {
                border: 2px solid #0071e3; /* Добавляем синюю рамку */
                transform: scale(1.05); /* Чуть-чуть увеличиваем карточку */
            }
            h1 {
                color: #ff4500; /* Ярко-оранжевый заголовок только на ПК */
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ваша круглая аватарка (убедитесь, что файл avatar.jpg лежит в той же папки) -->
        <img src="avatar.jpg" alt="Моё фото" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px;">
        
        <h1>Привет, Я Турганбаев Абубакир</h1>
        <p>Я создаю его на своём Mac с нуля и настраиваю под разные экраны.</p>
        
        <button onclick="alert('Ура! Всё работает!')">Нажми на меня</button>
        
        <!-- Ссылка на вторую страницу -->
        <div class="link-container">
            <a href="projects.html">Посмотреть мои проекты →</a>
        </div>
    </div>

</body>
</html>
